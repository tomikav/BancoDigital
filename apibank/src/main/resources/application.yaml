server:
  port: 4200

spring:
  application:
    name: banco-digital-be
  web:
    locale: es
    locale-resolver: fixed
  datasource:
    url: "jdbc:mysql://localhost/bank_database"
    username: "root"
    password: ""

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      # "user" is a reserved word in standard SQL (H2, PostgreSQL); let Hibernate quote it
      hibernate.auto_quote_keyword: true
