plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'

    id ("io.freefair.lombok") version "9.8.3"
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'banco-digital-be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('buildFront', Exec) {
    workingDir '../frontbank'
    inputs.dir('../frontbank/src')
    inputs.dir('../frontbank/public')
    inputs.file('../frontbank/angular.json')
    inputs.file('../frontbank/package.json')
    outputs.dir('../frontbank/dist')
    def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
    commandLine npm, 'run', 'build'
}

tasks.named('processResources') {
    dependsOn 'buildFront'
    from('../frontbank/dist/banco-digital-fe/browser') {
        into 'static'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
